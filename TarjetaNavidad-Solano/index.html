<!-- Este desarrollo vamos a diseñar una tarjeta interactiva de Navidad-->
<!--Nombre: Emiliano Solano-->
<!--Actividad 1-->

<!DOCTYPE html> <!-- Esta etiqueta declara el tipo de documento-->
<html lang="es">
<head>
    <!-- El titulo de la pagina no es visible en el desarrollo pero es lo que funciona para el SEO-->
<title> Tarjeta de Navidad | Personalizados </title>
<!--En la etiqueta head va todo lo que no es visible en la pagina web pero la hace funcional-->
<!--Acontinuación los metadatos para que la pagina reconozca, caractéres especiales, y 
se adapte a diferentes dispositivos-->
<meta charset="UTF-8"> <!--Este metadato es para los caracteres especiales-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tarjeta de Navidad interactiva con diseño personalizado">
<meta name="author" content="Emiliano Solano">

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

<link rel="stylesheet" href="styles.css">
</head> <!-- HASTA AQUI VA EL HEAD-->

<!-- AQUI INICIA EL BODY-->
<body>
<div class="main-container">
   <!-- Cover -->
   <div class="page active" id="page-0">
    <div class="float-container">
     <img src="Tarjeta de navidad.avif" alt="Merry Christmas" class="cover-img">
    </div>
    <h1 class="cover-title">Feliz Navidad 2026 🎄 </h1>
    <p class="cover-subtitle">Con todo nuestro amor para ti</p>
    <button id="btn-enter" class="btn-primary">
      <span class="btn-text">Click </span>
    </button>
   </div>

   <!-- Mensaje pagina 1-->
  <div class="page" id="pagina1">
    <div class="photo-circle">
      <img class="photo-img" loading="lazy" src="Navidad 2.jpeg" alt="Imagen de mesa navideña">
    </div>
    <p class="msg-text">En esta Navidad te deseo mucha gratitud 💛</p>
    <button id="btn-next-1" class="btn-secondary">
      <span class="btn-text">Siguiente</span>
    </button>
   </div>

<!-- Mensaje pagina 2-->
 <div class="page" id="pagina2">
    <h2 class="gallery-title">Nuestros mejores deseos ✨</h2>
    <div class="gallery-grid">
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="Cena navideña.jpg" alt="cena en familia para navidad">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="Carta familiar navideña.webp" alt="dinamica familiar">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="Familia Navideña.jpeg" alt="decorando el arbol de navidad">
     </div>
    </div>
  
    <p class="gallery-caption">Los mejores momentos se comparten en familia, en una cena o un momento juntos. En esta navidad les deseamos union y un hogar lleno de amor y paz.</p>
   </div>

<script src="script.js"></script>
</body>
</html>
